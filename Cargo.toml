[workspace]
resolver = "2"
members = ["crates/heic-decoder", "crates/heic-thumbnail", "crates/heic-convert", "crates/thumbnail-probe"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Josef Fürlinger"]
rust-version = "1.89"

[profile.release]
# Must stay "unwind": the COM layer relies on catch_unwind to never let a panic cross the FFI boundary.
panic = "unwind"
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
